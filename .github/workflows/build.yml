name: build
on: [push, pull_request]
jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore MDS.Platform.sln
      - run: dotnet build MDS.Platform.sln --configuration Release --no-restore
      - run: dotnet test MDS.Platform.sln --configuration Release --no-build
