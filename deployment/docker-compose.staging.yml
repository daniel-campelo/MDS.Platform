services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mds_studio
      POSTGRES_USER: mds_studio
      POSTGRES_PASSWORD: ${MDS_STUDIO_POSTGRES_PASSWORD}
    ports: ["5433:5432"]
    volumes: ["mds-studio-postgres:/var/lib/postgresql/data"]
volumes:
  mds-studio-postgres:
